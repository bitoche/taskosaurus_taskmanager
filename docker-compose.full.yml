services:
  # ── База данных PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: taskmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmanager} -d ${POSTGRES_DB:-taskmanager}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Бэкенд микросервис (FastAPI) ─────────────────────────────────────────────
  taskservice:
    build:
      context: ./taskmanager
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_DB_HOST: ${APP_DB_HOST:-db}
      APP_DB_PORT: ${APP_DB_PORT:-5432}
      APP_DB_USER: ${POSTGRES_USER:-taskmanager}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
      APP_DB_NAME: ${POSTGRES_DB:-taskmanager}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-taskmanager-change-this-secret-key-in-prod-32ch}"
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-false}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
      APP_ACCESS_TOKEN_EXPIRE_MINUTES: "${APP_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}"
      APP_INVITE_TOKEN_EXPIRE_HOURS: "${APP_INVITE_TOKEN_EXPIRE_HOURS:-48}"
    volumes:
      - taskmanager_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Порт бэкенда привязан к localhost для локального тестирования/Swagger,
      # публичный трафик идет через Nginx (webui)
      - "${API_PORT:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Фронтенд (React SPA + Nginx Reverse Proxy) ──────────────────────────────
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    container_name: taskmanager-webui
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      taskservice:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: taskmanager_postgres_data
  taskmanager_logs:
    name: taskmanager_logs

networks:
  app_network:
    name: taskmanager_network
    driver: bridge
