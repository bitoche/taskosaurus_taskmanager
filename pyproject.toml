[project]
name = "taskmanager"
version = "3.1.1"
description = "Асинхронный микросервис календаря и управления задачами (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
taskmanager = "taskmanager.main:app"
taskmanager-cli = "taskmanager.cli:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
